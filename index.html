<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EEO DATA - Buy Cheap Data</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#151515;border-radius:20px;padding:25px;width:100%;max-width:380px;border:1px solid #222}
h1{color:#00ff88;text-align:center;font-size:28px;margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:12px;border-radius:12px;border:none;background:#222;color:#aaa;font-weight:600;cursor:pointer}
.tab.active{background:#00ff88;color:#000}
select,input{width:100%;padding:15px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;margin-bottom:15px;font-size:16px;outline:none}
.btn{width:100%;padding:16px;border-radius:12px;border:none;background:#00ff88;color:#000;font-weight:800;font-size:16px;cursor:pointer}
.msg{margin-top:15px;padding:12px;border-radius:10px;font-size:14px;display:none}
.msg.error{display:block;background:#1a2a1a;border:1px solid #ff4444;color:#ff8888}
.msg.success{display:block;background:#0f2a1a;border:1px solid #00ff88;color:#00ff88}
</style>
</head>
<body>
<div class="card">
<h1>EEO DATA</h1>
<div class="tabs">
<button class="tab active">DATA</button>
<button class="tab" onclick="alert('Airtime soon')">AIRTIME</button>
</div>

<select id="network">
<option value="1">MTN</option>
<option value="2">AIRTEL</option>
<option value="3">GLO</option>
<option value="4">SMOBILE</option>
</select>

<input id="phone" type="tel" placeholder="08105629776" value="08105629776" maxlength="11">
<select id="plan">
<option value="">-- Select Plan --</option>
<option value="1">MTN 500MB ₦190 (you sell ₦290 = ₦100 profit)</option>
<option value="2">MTN 1GB - Check MBC ID for this</option>
<option value="3">MTN 2GB - Check MBC ID</option>
</select>

<button id="buyBtn" class="btn" onclick="buyData()">BUY DATA NOW</button>
<div id="msg" class="msg"></div>
</div>

<script>
async function buyData(){
 const phone = document.getElementById('phone').value.trim();
 const data_plan_id = document.getElementById('plan').value;
 const network = document.getElementById('network').value;
 const msgEl = document.getElementById('msg');
 const btn = document.getElementById('buyBtn');

 if(phone.length !== 11){ msgEl.textContent='Phone must be 11 digits'; msgEl.className='msg error'; return; }
 if(!data_plan_id){ msgEl.textContent='Select plan'; msgEl.className='msg error'; return; }

 btn.disabled=true; btn.textContent='Processing...';
 msgEl.textContent='Connecting to MBC...'; msgEl.className='msg success';

 try{
   const res = await fetch('/api/buy-data', {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify({ phone: phone, data_plan_id: parseInt(data_plan_id), network: parseInt(network) })
   });
   const data = await res.json();
   if(res.ok && data.success){
     msgEl.textContent='✅ '+(data.message||'Success!'); msgEl.className='msg success';
   } else {
     msgEl.textContent='❌ '+(data.error||'Failed'); msgEl.className='msg error';
   }
 }catch(e){
   msgEl.textContent='❌ Network error: '+e.message; msgEl.className='msg error';
 }finally{
   btn.disabled=false; btn.textContent='BUY DATA NOW';
 }
}
</script>
</body>
</html>
