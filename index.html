<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEO Data - Cheap Data</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:20px}input,select,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:none}button{background:#00c853;color:#fff;font-weight:bold;font-size:16px}</style>
</head>
<body>
<h2>EEO Data - Buy Data</h2>
<select id="network"><option value="1">MTN</option><option value="2">Glo</option><option value="3">Airtel</option><option value="4">9mobile</option></select>
<input id="phone" placeholder="Phone number e.g 081..." type="tel"/>
<select id="plan"><option value="1">1GB - ₦300</option><option value="2">2GB - ₦600</option><option value="3">5GB - ₦1400</option></select>
<button onclick="buyData()" id="btn">BUY DATA NOW</button>
<p id="msg"></p>

<script>
async function buyData(){
  const btn=document.getElementById('btn');
  const msg=document.getElementById('msg');
  btn.innerText='Processing...';
  msg.innerText='';
  try{
    const res=await fetch('/api/buy-data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        network:document.getElementById('network').value,
        phone:document.getElementById('phone').value,
        plan:document.getElementById('plan').value
      })
    });
    const data=await res.json();
    console.log(data);
    msg.innerText=JSON.stringify(data);
    if(data.status==='success' || data.Status==='successful'){
      alert('SUCCESS! Data sent!');
    } else {
      alert('Response: '+JSON.stringify(data));
    }
  }catch(e){alert('Error: '+e.message); msg.innerText=e.message}
  btn.innerText='BUY DATA NOW';
}
</script>
</body>
</html>
